name: API benchmarks
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run benchmarks
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: runner.os−test−env.cache−name−{{ hashFiles('**/Project.toml') }}
          restore-keys: |
            runner.os−test−
            ${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Run benchmark
        run: |
          julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=. --color=yes test/benchmark-api.jl --output test/output.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Julia benchmark result
          tool: 'customSmallerIsBetter'
          output-file-path: test/output.json
          github-token: ${{ github.token }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@EdJeeOnGitHub'

      - name: Check out generated dashboard
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: benchmark-site
          persist-credentials: false
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-site

  deploy:
    name: Publish benchmark dashboard
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
